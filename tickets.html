<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111f"><title>تیکت‌های پشتیبانی | وب‌ساز مرادی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#10233a;--line:rgba(148,190,225,.2);--text:#f4f8ff;--muted:#a7b8cc;--accent:#5ee7f5;--good:#63e6a6;--bad:#ff8795}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#173653 0,var(--bg) 48%);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;min-height:100vh}.wrap{width:min(900px,92%);margin:34px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:26px}.brand{font-weight:800;font-size:20px}.links{display:flex;gap:9px;flex-wrap:wrap}a,.btn{color:#07111f;background:var(--accent);padding:10px 15px;border-radius:10px;text-decoration:none;border:0;font:inherit;font-weight:700;cursor:pointer}.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.panel,.ticket{background:rgba(16,35,58,.94);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}.muted{color:var(--muted)}h1{font-size:26px;margin:8px 0}label{display:block;margin:10px 0 6px}input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#071827;color:var(--text);font:inherit}textarea{min-height:105px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.status{margin-top:12px;color:var(--good)}.status.error{color:var(--bad)}.ticket{background:#0b1c2e}.ticket p{white-space:pre-wrap;line-height:1.9}.reply{padding:11px;border-radius:10px;background:#17314d;margin:8px 0}.reply.admin{border-right:3px solid var(--accent)}.reply.customer{border-right:3px solid var(--good)}.replyform{display:flex;gap:9px;align-items:flex-start;margin-top:12px}.replyform textarea{flex:1;min-height:60px}.empty{text-align:center;padding:25px;color:var(--muted)}@media(max-width:600px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.replyform{flex-direction:column}.replyform button{width:100%}}
</style><link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="robots" content="noindex, follow">
<link rel="stylesheet" href="marketplace-upgrade.css?v=20261126d">
</head><body><main class="wrap">
<div class="top"><div class="brand">🎫 وب‌ساز مرادی | پشتیبانی</div><div class="links"><a class="ghost" href="index.html">صفحه اصلی</a><a class="ghost" href="account.html">پنل مشتری</a><a id="authLink" href="auth.html?next=tickets.html" class="ghost">ورود / ثبت‌نام</a><details class="profile-menu"><summary aria-label="منوی پروفایل" title="منوی پروفایل"><span class="profile-menu-icon"><i></i><i></i><i></i></span></summary><div class="profile-menu-list"><a href="account.html">پروفایل من</a><a href="order.html">ثبت سفارش</a><a href="tracking.html">پیگیری سفارش</a><a href="index.html">صفحه اصلی</a></div></details></div></div>
<section class="panel"><h1>تیکت‌های پشتیبانی</h1><p class="muted">درخواستت را ثبت کن و پاسخ‌های پشتیبانی را از همین صفحه دنبال کن.</p><div id="loginNotice" class="status">برای ثبت و مشاهده تیکت‌ها ابتدا وارد حساب کاربری شو.</div>
<form id="ticketForm" hidden><div class="formgrid"><div><label for="ticketName">نام و نام خانوادگی</label><input id="ticketName" maxlength="100" autocomplete="name" required></div><div><label for="ticketPhone">شماره تماس</label><input id="ticketPhone" maxlength="30" inputmode="tel" autocomplete="tel" required></div><div class="full"><label for="ticketSubject">موضوع تیکت</label><input id="ticketSubject" maxlength="80" required></div><div class="full"><label for="ticketBody">توضیحات درخواست</label><textarea id="ticketBody" maxlength="1000" required></textarea></div><div class="full"><button class="btn" id="ticketSubmit" type="submit">ثبت تیکت</button></div></div></form><div id="ticketStatus" class="status" role="status" aria-live="polite"></div></section>
<section class="panel"><h2>درخواست‌های من</h2><div id="ticketList"><div class="empty">در حال بررسی حساب کاربری...</div></div></section></main>
<script>
(()=>{'use strict';
const SUPABASE_URL='https://oczpjbwwogsydzkouxtj.supabase.co';
const SUPABASE_KEY='sb_publishable_MS-mpTamnXY57k8pIllgVA_rRpqAEQ0';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);let currentUser=null;
function status(msg,error=false){$('ticketStatus').textContent=msg;$('ticketStatus').className='status'+(error?' error':'')}
function node(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined)el.textContent=txt;return el}
async function renderTickets(){const box=$('ticketList');box.replaceChildren();if(!currentUser){box.append(node('div','empty','برای مشاهده تیکت‌ها وارد حساب کاربری شو.'));return}
try{const {data,error}=await db.from('support_tickets').select('id,subject,message,status,created_at').eq('user_id',currentUser.id).order('created_at',{ascending:false}).limit(30);if(error)throw error;if(!data?.length){box.append(node('div','empty','هنوز تیکتی ثبت نکرده‌ای.'));return}
for(const t of data){const card=node('article','ticket');card.append(node('h3','',t.subject));const date=t.created_at?new Date(t.created_at).toLocaleString('fa-IR'):'';card.append(node('p','',`${t.message||''}
وضعیت: ${t.status||'در انتظار بررسی'}
${date}`));const replies=node('div');const {data:rows,error:replyError}=await db.from('support_ticket_replies').select('id,sender_role,message,created_at').eq('ticket_id',t.id).order('created_at',{ascending:true});if(replyError)replies.append(node('p','muted','دریافت پاسخ‌ها ممکن نشد.'));else if(!rows?.length)replies.append(node('p','muted','هنوز پاسخی ثبت نشده است.'));else rows.forEach(r=>{const line=node('div','reply '+(r.sender_role==='admin'?'admin':'customer'));line.append(node('strong','',r.sender_role==='admin'?'پاسخ پشتیبانی':'پیام شما'),node('p','',r.message));replies.append(line)});card.append(replies);
const form=node('form','replyform'),input=node('textarea');input.maxLength=3000;input.required=true;input.placeholder='پاسخ شما به پشتیبانی...';const send=node('button','btn','ارسال پاسخ');send.type='submit';form.append(input,send);form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;send.disabled=true;const {error}=await db.from('support_ticket_replies').insert({ticket_id:t.id,user_id:currentUser.id,sender_role:'customer',message});send.disabled=false;if(error){status('ارسال پاسخ انجام نشد: '+error.message,true);return}status('پاسخ شما ارسال شد.');await renderTickets()});card.append(form);box.append(card)}
}catch(error){console.error(error);box.append(node('div','empty','دریافت تیکت‌ها انجام نشد: '+(error.message||'خطای نامشخص')))}}
$('ticketForm').addEventListener('submit',async e=>{e.preventDefault();if(!currentUser){status('ابتدا وارد حساب کاربری شو.',true);return}const button=$('ticketSubmit');button.disabled=true;status('در حال ثبت تیکت...');try{const {error}=await db.from('support_tickets').insert({user_id:currentUser.id,customer_name:$('ticketName').value.trim(),phone:$('ticketPhone').value.trim(),subject:$('ticketSubject').value.trim(),message:$('ticketBody').value.trim()});if(error)throw error;$('ticketForm').reset();status('تیکت با موفقیت ثبت شد.');await renderTickets()}catch(error){status('ثبت تیکت انجام نشد: '+(error.message||'خطای نامشخص'),true)}finally{button.disabled=false}});
async function init(){const {data,error}=await db.auth.getUser();currentUser=!error?data.user:null;$('ticketForm').hidden=!currentUser;$('loginNotice').textContent=currentUser?'حساب شما متصل است؛ می‌توانی تیکت ثبت کنی یا پاسخ بدهی.':'برای ثبت و مشاهده تیکت‌ها ابتدا وارد حساب کاربری شو.';$('authLink').textContent=currentUser?'حساب کاربری':'ورود / ثبت‌نام';$('authLink').href=currentUser?'account.html':'auth.html?next=tickets.html';await renderTickets()}
db.auth.onAuthStateChange(()=>setTimeout(init,0));init();
})();
</script><script src="marketplace-upgrade.js?v=20261126d"></script>
</body></html>
