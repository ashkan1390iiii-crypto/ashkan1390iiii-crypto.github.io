<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود و ثبت‌نام مشتریان | وب‌ساز مرادی</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 background:#07111f;color:#fff;font-family:tahoma,Arial;
 padding:20px
}
.card{
 width:100%;max-width:420px;background:#101e30;
 padding:30px;border-radius:22px;
 border:1px solid #263b52
}
h1{text-align:center;color:#42d9ff}
p{text-align:center;color:#a9bbce}
input,button{
 width:100%;padding:15px;margin-top:13px;
 border-radius:10px;font-size:15px
}
input{background:#07111f;color:white;border:1px solid #344b64}
button{
 background:#12bde8;color:#06121d;border:0;
 font-weight:bold;cursor:pointer
}
button.secondary{background:#263b52;color:white}
#message{line-height:2;font-size:13px;text-align:center}
</style>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="robots" content="noindex, follow">
<link rel="stylesheet" href="marketplace-upgrade.css?v=20261126h">
</head>
<body>
<div class="card">
<h1>وب‌ساز مرادی</h1>
<p>حساب کاربری مشتریان</p>

<input id="email" type="email" placeholder="ایمیل">
<input id="password" type="password" placeholder="رمز عبور (حداقل ۱۰ کاراکتر برای ثبت‌نام)" autocomplete="current-password">

<button id="signupButton" type="button" onclick="signup()">ثبت‌نام</button>
<button class="secondary" id="loginButton" type="button" onclick="login()">ورود به حساب</button>

<div id="message" role="status" aria-live="polite"></div>
</div>

<script>
const SUPABASE_URL =
'https://oczpjbwwogsydzkouxtj.supabase.co';

const SUPABASE_KEY =
'sb_publishable_MS-mpTamnXY57k8pIllgVA_rRpqAEQ0';

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const message = document.getElementById('message');
const signupButton = document.getElementById('signupButton');
const loginButton = document.getElementById('loginButton');
let authBusy = false;

function showAuthError(error){
 const raw=String(error?.message||error||'');
 const network=/failed to fetch|networkerror|load failed|fetch failed/i.test(raw);
 message.textContent=network
  ? 'ارتباط با سرویس ورود برقرار نشد. اتصال اینترنت را بررسی کن و دوباره تلاش کن؛ اگر مشکل ادامه داشت، چند دقیقه بعد دوباره امتحان کن.'
  : (raw||'عملیات انجام نشد. دوباره تلاش کن.');
}

function setAuthBusy(busy,activeButton){
 authBusy=busy;
 signupButton.disabled=busy;
 loginButton.disabled=busy;
 signupButton.textContent=busy&&activeButton===signupButton?'لطفاً صبر کن...':'ثبت‌نام';
 loginButton.textContent=busy&&activeButton===loginButton?'لطفاً صبر کن...':'ورود به حساب';
}
function withAuthTimeout(request,ms=15000){
 let timer;
 const timeout=new Promise((_,reject)=>{
  timer=setTimeout(()=>reject(new Error('پاسخی از سرویس دریافت نشد. اتصال اینترنت را بررسی کن و دوباره تلاش کن.')),ms);
 });
 return Promise.race([request,timeout]).finally(()=>clearTimeout(timer));
}

function safeNextPath(raw){
 try{
  const target=new URL(raw||'account.html',location.origin);
  if(target.origin!==location.origin || target.pathname.endsWith('/auth.html')) return 'account.html';
  return target.pathname+target.search+target.hash;
 }catch(_){return 'account.html';}
}
const nextDestination=safeNextPath(new URLSearchParams(location.search).get('next'));

withAuthTimeout(db.auth.getSession()).then(({data,error})=>{
 if(error)throw error;
 if(data?.session && new URLSearchParams(location.search).has('next')){
  location.replace(nextDestination);
 }
}).catch(showAuthError);

async function signup(){
 if(authBusy)return;
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 if(!email||!document.getElementById('email').checkValidity()||password.length<10){
  message.textContent='ایمیل معتبر را وارد کن و برای ثبت‌نام رمز حداقل ۱۰ کاراکتری انتخاب کن.';
  return;
 }
 setAuthBusy(true,signupButton);message.textContent='در حال ایجاد حساب...';
 try{
  const {data,error}=await withAuthTimeout(db.auth.signUp({
   email,password,
   options:{emailRedirectTo:location.origin+'/auth.html?next='+encodeURIComponent(nextDestination)}
  }));
  if(error)throw error;
  if(data?.session){message.textContent='حساب ساخته شد؛ در حال انتقال به پنل...';location.replace(nextDestination);return;}
  message.textContent='درخواست ثبت‌نام ارسال شد. ایمیلت را برای تأیید حساب بررسی کن.';
 }catch(error){showAuthError(error)}
 finally{setAuthBusy(false,null)}
}

async function login(){
 if(authBusy)return;
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 if(!email||!document.getElementById('email').checkValidity()||!password){
  message.textContent='ایمیل معتبر و رمز عبور را وارد کن.';
  return;
 }
 setAuthBusy(true,loginButton);message.textContent='در حال ورود...';
 try{
  const {error}=await withAuthTimeout(db.auth.signInWithPassword({email,password}));
  if(error)throw error;
  location.replace(nextDestination);
 }catch(error){showAuthError(error)}
 finally{setAuthBusy(false,null)}
}
</script>
<script src="marketplace-upgrade.js?v=20261126h"></script>
</body>
  </html>
