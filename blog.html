<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>مقاله | وب‌ساز مرادی</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{color-scheme:dark;--bg:#07111f;--panel:#10233a;--line:rgba(148,190,225,.2);--text:#f4f8ff;--muted:#a7b8cc;--accent:#5ee7f5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#173653,var(--bg) 50%);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif}.wrap{width:min(850px,92%);margin:35px auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,36px)}a{color:var(--accent)}h1{line-height:1.7}p{line-height:2.2;color:var(--muted);white-space:pre-wrap}.cover{width:100%;max-height:360px;object-fit:cover;border-radius:14px;margin:14px 0}.muted{color:var(--muted)}</style></head><body><main class="wrap"><p style="display:flex;align-items:center;gap:12px"><a href="index.html"><img src="logo.svg" alt="لوگوی وب‌ساز مرادی" width="46" height="46"></a><a href="articles.html">← بازگشت به وبلاگ</a></p><article class="card" id="article"><p class="muted">در حال دریافت مقاله...</p></article></main><script>
const db=supabase.createClient('https://oczpjbwwogsydzkouxtj.supabase.co','sb_publishable_MS-mpTamnXY57k8pIllgVA_rRpqAEQ0');
(async()=>{const slug=new URLSearchParams(location.search).get('slug');const box=document.getElementById('article');if(!slug){box.textContent='مقاله پیدا نشد.';return}const {data,error}=await db.from('blog_posts').select('title,body,excerpt,cover_url,published_at').eq('slug',slug).eq('is_published',true).maybeSingle();box.replaceChildren();if(error||!data){box.textContent='این مقاله وجود ندارد یا منتشر نشده است.';return}const h=document.createElement('h1');h.textContent=data.title;box.append(h);const meta=document.createElement('p');meta.className='muted';meta.textContent=data.published_at?new Date(data.published_at).toLocaleDateString('fa-IR'):'';box.append(meta);if(data.cover_url){const img=document.createElement('img');img.className='cover';img.src=data.cover_url;img.alt=data.title;box.append(img)}const p=document.createElement('p');p.textContent=data.body;box.append(p)})();
</script></body></html>
