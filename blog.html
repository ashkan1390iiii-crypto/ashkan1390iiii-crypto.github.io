const db=supabase.createClient('https://oczpjbwwogsydzkouxtj.supabase.co','sb_publishable_MS-mpTamnXY57k8pIllgVA_rRpqAEQ0');
(async()=>{const slug=new URLSearchParams(location.search).get('slug');const box=document.getElementById('article');if(!slug){box.textContent='مقاله پیدا نشد.';return}const {data,error}=await db.from('blog_posts').select('title,body,excerpt,cover_url,published_at').eq('slug',slug).eq('is_published',true).maybeSingle();box.replaceChildren();if(error||!data){box.textContent='این مقاله وجود ندارد یا منتشر نشده است.';let robots=document.querySelector('meta[name="robots"]');if(!robots){robots=document.createElement('meta');robots.name='robots';document.head.append(robots)}robots.content='noindex, follow';return}

document.title=data.title+' | وب‌ساز مرادی';
const setMeta=(selector,content)=>{let el=document.querySelector(selector);if(!el){el=document.createElement('meta');const parts=selector.match(/\[(name|property)="([^"]+)"\]/);if(parts)el.setAttribute(parts[1],parts[2]);document.head.append(el)}el.content=content};

setMeta('meta[property="og:description"]',articleDescription);
setMeta('meta[property="og:url"]',articleUrl);
let canonical=document.querySelector('link[rel="canonical"]');if(!canonical){canonical=document.createElement('link');canonical.rel='canonical';document.head.append(canonical)}canonical.href=articleUrl;
const schema=document.createElement('script');schema.type='application/ld+json';schema.textContent=JSON.stringify({"@context":"https://schema.org","@type":"BlogPosting","headline":data.title,"description":articleDescription,"datePublished":data.published_at||undefined,"image":data.cover_url||undefined,"mainEntityOfPage":articleUrl,"publisher":{"@type":"Organization","name":"وب‌ساز مرادی","url":location.origin}});document.head.append(schema);
const h=document.createElement('h1');h.textContent=data.title;box.append(h);const meta=document.createElement('p');meta.className='muted';meta.textContent=data.published_at?new Date(data.published_at).toLocaleDateString('fa-IR'):'';box.append(meta);if(data.cover_url){const img=document.createElement('img');img.className='cover';img.src=data.cover_url;img.alt=data.title;box.append(img)}const p=document.createElement('p');p.textContent=data.body;box.append(p)})();
