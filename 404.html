<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta name="robots" content="noindex, follow">
  <title>صفحه پیدا نشد | وب‌ساز مرادی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#163653 0,transparent 42rem),#07111f;color:#f4f8ff;font-family:Vazirmatn,Tahoma,sans-serif}
    main{width:min(100%,560px);padding:42px 28px;text-align:center;background:rgba(16,35,58,.82);border:1px solid rgba(148,190,225,.2);border-radius:28px;box-shadow:0 24px 80px #0005}
    .brand{font-size:14px;font-weight:800;letter-spacing:.3px;color:#65e5f3}
    .code{margin:22px 0 4px;font-size:clamp(76px,18vw,120px);line-height:1;font-weight:900;letter-spacing:-5px;background:linear-gradient(120deg,#5ee7f5,#8b9dff);-webkit-background-clip:text;background-clip:text;color:transparent}
    h1{margin:18px 0 10px;font-size:clamp(22px,5vw,30px)}
    p{margin:0 auto;color:#a9bbce;line-height:2;max-width:410px}
    .actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:28px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:13px;text-decoration:none;font-weight:800;transition:transform .2s,opacity .2s}
    a:hover{transform:translateY(-2px)}
    .primary{background:linear-gradient(120deg,#5ee7f5,#8b9dff);color:#07111f}
    .secondary{border:1px solid #42617e;color:#e8f2ff}
    @media(max-width:420px){main{padding:34px 20px}.actions{flex-direction:column}a{width:100%}}
  </style>
</head>
<body>
  <main>
    <div class="brand">MW · وب‌ساز مرادی</div>
    <div class="code" aria-label="خطای ۴۰۴">404</div>
    <h1>این صفحه پیدا نشد!</h1>
    <p>ممکن است آدرس اشتباه باشد یا صفحه جابه‌جا شده باشد. از دکمه زیر به صفحه اصلی برگرد.</p>
    <div class="actions">
      <a class="primary" href="/">بازگشت به صفحه اصلی</a>
      <a class="secondary" href="/#order">ثبت سفارش</a>
    </div>
  </main>
</body>
</html>
